{{ define "main" }}
  <section class="list-content">
    <header class="list-header card glass">
      <h1 class="list-title">分类：{{ .Title }}</h1>
      <p class="list-description">共 {{ len .Pages }} 篇文章</p>
    </header>

    <div class="post-list">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">该分类下暂无文章</p>
      {{ end }}
    </div>

    {{ partial "pagination.html" . }}
  </section>
{{ end }}
