<header class="navbar glass" id="navbar">
  <div class="navbar-inner">
    <a class="brand" href="{{ .Site.BaseURL }}">
      <img src="{{ .Site.Params.favicon | default "/favicon.ico" }}" alt="{{ .Site.Title }}" class="brand-logo">
      <span class="brand-name">{{ .Site.Title }}</span>
    </a>

    <nav class="nav" aria-label="主导航" id="nav">
      {{- if .Site.Menus.main }}
        {{- range .Site.Menus.main }}
        {{- $url := .URL | relURL }}
        <a class="nav-item{{ if eq $url $.RelPermalink }} active{{ end }}" href="{{ $url }}"{{ if hasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
        {{- end }}
      {{- else }}
      <a class="nav-item{{ if .IsHome }} active{{ end }}" href="{{ .Site.BaseURL }}">首页</a>

      {{ range .Site.Taxonomies.categories.Alphabetical }}
        <a class="nav-item{{ if eq $.Permalink .Page.Permalink }} active{{ end }}" href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
      {{ end }}

      <a class="nav-item{{ if eq .RelPermalink "/about/" }} active{{ end }}" href="{{ "/about/" | relURL }}">关于</a>
      {{- end }}

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅主题" title="切换主题">
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="4"/>
            <line x1="12" y1="20" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="4" y2="12"/>
            <line x1="20" y1="12" x2="22" y2="12"/>
            <line x1="4.5" y1="4.5" x2="6" y2="6"/>
            <line x1="18" y1="18" x2="19.5" y2="19.5"/>
            <line x1="4.5" y1="19.5" x2="6" y2="18"/>
            <line x1="18" y1="6" x2="19.5" y2="4.5"/>
          </g>
        </svg>
      </button>
    </nav>

    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="展开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
