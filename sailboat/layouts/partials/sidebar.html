<aside class="sidebar" id="sidebar" aria-label="侧边栏">
  <section class="sidebar-section glass card">
    <form class="search-form" role="search" id="search-form" autocomplete="off">
      <label for="search-input" class="visually-hidden">搜索文章</label>
      <input type="search" id="search-input" placeholder="搜索文章..." aria-label="搜索文章">
      <button type="submit" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <ul class="search-results" id="search-results" hidden></ul>
  </section>

  <section class="sidebar-section glass card">
    <h3 class="sidebar-title">最近文章</h3>
    <ul class="recent-posts" id="recent-posts">
      {{ range first 5 .Site.RegularPages }}
        <li class="recent-post-item">
          <a href="{{ .RelPermalink }}">
            <span class="post-title">{{ .Title }}</span>
            <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
          </a>
        </li>
      {{ else }}
        <li class="recent-post-empty">暂无文章</li>
      {{ end }}
    </ul>
  </section>
</aside>
