<article class="post-card card glass">
  <h2 class="post-card-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>
  <div class="post-card-meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .GetTerms "categories" }}
      <span class="meta-sep">·</span>
      {{ range . }}<a href="{{ .Permalink }}">{{ .Title }}</a>{{ end }}
    {{ end }}
  </div>
  <p class="post-card-summary">{{ .Summary | plainify | truncate 120 }}</p>
  <a class="read-more" href="{{ .RelPermalink }}">阅读全文 →</a>
</article>
