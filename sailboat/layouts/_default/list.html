{{ define "main" }}
  <section class="list-content">
    <header class="list-header card glass">
      <h1 class="list-title">{{ .Title }}</h1>
      {{ with .Content }}<div class="list-description">{{ . }}</div>{{ end }}
    </header>

    <div class="post-list">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">暂无内容</p>
      {{ end }}
    </div>

    {{ partial "pagination.html" . }}
  </section>
{{ end }}
